apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: testovoe-app
spec:
  ingressClassName: nginx
  rules:
    - host: app.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: testovoe-app
                port:
                  number: 8000
