---
# Ставит kubeadm/kubelet/kubectl из официального репозитория pkgs.k8s.io,
# закреплённого на минорной версии {{ k8s_version }}, и держит их через
# apt-mark hold (чтобы случайный apt upgrade не сломал совместимость
# control-plane/kubelet между собой).

- name: Ensure apt keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# Этот конкретный хост (pkgs.k8s.io) периодически ловит таймаут
# рукопожатия/соединения через NAT этой лабы — не повторяем скачивание,
# если ключ уже лежит в итоговом keyring-файле от прошлого прогона.
- name: Check whether the Kubernetes apt signing keyring already exists
  stat:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  register: k8s_apt_keyring

- name: Download Kubernetes apt signing key
  get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key"
    dest: /tmp/kubernetes-release.key
    mode: "0644"
  when: not k8s_apt_keyring.stat.exists

- name: Dearmor Kubernetes apt signing key into keyring
  command: >
    gpg --batch --yes --dearmor
    -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    /tmp/kubernetes-release.key
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Add Kubernetes apt repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /"
    filename: kubernetes
    state: present

- name: Install kubelet, kubeadm, kubectl
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: true

- name: Hold Kubernetes packages at the installed version
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
