---
- name: Check whether this node is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: kubeadm init (control-plane)
  command: >
    kubeadm init
    --apiserver-advertise-address={{ ansible_default_ipv4.address }}
    --pod-network-cidr={{ pod_network_cidr }}
  when: not admin_conf.stat.exists

- name: Create .kube directory for the vagrant user
  file:
    path: /home/vagrant/.kube
    state: directory
    owner: vagrant
    group: vagrant
    mode: "0755"

- name: Copy admin kubeconfig for the vagrant user
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/vagrant/.kube/config
    owner: vagrant
    group: vagrant
    mode: "0600"
    remote_src: true

- name: Install the Calico CNI manifest
  command: "kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f {{ calico_manifest_url }}"
  register: calico_apply
  changed_when: "'unchanged' not in calico_apply.stdout"

- name: Generate the kubeadm join command for workers
  command: kubeadm token create --print-join-command
  register: kubeadm_join_command
  changed_when: false

- name: Expose the join command to other hosts in this playbook run
  set_fact:
    join_command: "{{ kubeadm_join_command.stdout }}"
